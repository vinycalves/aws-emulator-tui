[workspace]
members = ["crates/emu-core", "crates/emu-tui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2.3"
roxmltree = "0.20"
flate2 = "1.0"
dirs = "6.0"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
unicode-width = "0.2"

emu-core = { path = "crates/emu-core" }

[profile.release]
lto = "thin"
strip = true